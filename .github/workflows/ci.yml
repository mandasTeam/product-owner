name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: pip install -r tools/requirements.txt
      - name: Arte do README gera sem erro
        run: python tools/build_banner.py
      - name: A skill passa na própria auditoria
        run: python skills/product-owner/scripts/auditar_escopo.py .
